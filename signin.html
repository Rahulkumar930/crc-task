<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
    }

    .container {
      width: 350px;
      margin: 100px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: purple;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: darkviolet;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Sign Up</h2>

  <form>
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <input type="password" placeholder="Confirm Password" required>

    <button type="submit">Register</button>
  </form>
</div>

</body>
</html>
