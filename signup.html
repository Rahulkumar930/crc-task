<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
    }

    .container {
      width: 350px;
      margin: 100px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: purple;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: darkviolet;
    }

    .link {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Sign In</h2>

  <form>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>

    <button type="submit">Login</button>
  </form>

  <div class="link">
    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
  </div>
</div>

</body>
</html>
