<!DOCTYPE html>
<html>
<head>
    <title>Task 5 - Multiply</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        .box {
            border: 1px solid black;
            display: inline-block;
            padding: 20px;
        }
        input {
            margin: 5px;
            padding: 5px;
        }
        button {
            margin: 5px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

<h2>Task 5</h2>

<div class="box">
    <div>
        1st Number: <input type="number" id="num1" value="12">
    </div>
    <div>
        2nd Number: <input type="number" id="num2" value="10">
    </div>

    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>

    <p>The Result is: <span id="result">120</span></p>
</div>

<script>
    function multiply() {
        let n1 = document.getElementById("num1").value;
        let n2 = document.getElementById("num2").value;

        let result = n1 * n2;

        document.getElementById("result").innerText = result;
    }

    function divide() {
        let n1 = document.getElementById("num1").value;
        let n2 = document.getElementById("num2").value;

        if (n2 == 0) {
            document.getElementById("result").innerText = "Cannot divide by 0";
        } else {
            let result = n1 / n2;
            document.getElementById("result").innerText = result;
        }
    }
</script>

</body>
</html>
