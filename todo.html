<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToDoList</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    
    <link href="https://fonts.googleapis.com/css?family=Tangerine" rel="stylesheet">

    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css">

    <style>
        #heading {
            height: 2em;
            font-size: 80px;
            background-color: #B2FF59;
            font-family: 'Tangerine', cursive;
        }

        #b-box {
            margin: 0 auto;
            width: 100%;
            height: 1000px;
            border: 2px solid black;
            border-top-style: double;
        }

        #box1 {
            width: 100%;
            box-shadow: inset 1px 1px 18px 5px black;
            height: 20%;
            margin: 0 auto;
            background-color: cadetblue;
            text-align: center;
            font-size: 40px;
            font-family: 'Tangerine', cursive;
            border-bottom-style: double;
        }

        #box2 {
            text-align: center;
            margin: 0 auto;
            font-family: Pristina;
            background-color: burlywood;
            text-decoration: underline;
            border-right: 2px solid black;
            width: 100%;
            height: 10%;
            font-size: 30px;
        }

        #box3 {
            font-family: 'Book Antiqua';
            font-size: 20px;
            width: 100%;
            height: 70%;
            text-align: center;
            margin: 0 auto;
            background-color: burlywood;
            border-right: 2px solid black;
            border-bottom: 4px solid black;
            overflow-y: auto;
        }

        .task {
            margin: 10px;
            padding: 5px;
            background: white;
            border-radius: 5px;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="heading" class="border border-success text-center shadow">TO DO LIST</div>

<div id="b-box">
    <div id="box1"><br>TO DO LIST!<br>
        <input id="inp" type="text" placeholder="enter your task here">
        <button id="btn">ADD</button>
    </div>

    <div id="box2"><br>TASKS</div>

    <div id="box3"></div>
</div>

<!-- JavaScript -->
<script>
    let btn = document.getElementById("btn");
    let input = document.getElementById("inp");
    let box3 = document.getElementById("box3");

    btn.addEventListener("click", function () {
        let taskText = input.value.trim();

        if (taskText === "") {
            alert("Please enter a task");
            return;
        }

        let taskDiv = document.createElement("div");
        taskDiv.classList.add("task");

        taskDiv.innerHTML = `
            ${taskText}
            <button style="margin-left:10px;background:red;color:white;">Delete</button>
        `;

        // Delete functionality
        taskDiv.querySelector("button").addEventListener("click", function () {
            taskDiv.remove();
        });

        box3.appendChild(taskDiv);
        input.value = "";
    });
</script>

</body>
</html>
